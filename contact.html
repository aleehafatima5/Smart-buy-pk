<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - SmartBuy PK</title>
<meta name="description" content="Send us a question, a suggestion or a store you want added.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23047857'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23f5b301' font-family='Arial' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('sb-theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<main>

  <div class="page-hero">
    <div class="wrap">
      <h1>Contact us</h1>
      <p>Have a question, an idea, or a store you want us to add? Tell us.</p>
    </div>
  </div>

  <section class="block" style="padding-top:0">
    <div class="wrap" style="max-width:760px">
      <div class="panel lift">
        <form id="contactForm" class="form">
          <div><label for="cn">Your name</label><input id="cn" required placeholder="Your name"></div>
          <div><label for="ce">Email</label><input id="ce" type="email" required placeholder="you@example.com"></div>
          <div class="full"><label for="ct">Topic</label>
            <select id="ct"><option>Question</option><option>Suggestion</option><option>Add a store</option><option>Report a problem</option></select></div>
          <div class="full"><label for="cm">Message</label><textarea id="cm" required placeholder="Write your message here"></textarea></div>
          <div class="full"><button class="btn" type="submit">Send message</button></div>
        </form>
        <div id="thanks" class="thanks hidden">✅ Thank you! Your message has been received.</div>
      </div>
    </div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
