<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stores Directory - SmartBuy PK</title>
<meta name="description" content="A directory of Pakistani, second-hand and international stores you can buy from.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23047857'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23f5b301' font-family='Arial' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('sb-theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="stores">
<main>

  <div class="page-hero">
    <div class="wrap">
      <h1>Stores directory</h1>
      <p>Pakistani stores, second-hand marketplaces and international sites in one place.</p>
    </div>
  </div>

  <section class="block">
    <div class="wrap">
      <div class="filters">
        <button class="pill on" data-type="all">All</button>
        <button class="pill" data-type="pk">Pakistan stores</button>
        <button class="pill" data-type="used">Used / local</button>
        <button class="pill" data-type="intl">International</button>
        <select id="storeCat" aria-label="Filter by category"></select>
        <input id="storeSearch" type="search" placeholder="Search a store">
        <span id="storeCount" style="color:var(--muted);font-weight:700;font-size:14px"></span>
      </div>
      <div class="grid g3" id="storeGrid"></div>
      <div class="notice" style="margin-top:26px">💡 Delivery areas, prices and return rules can change. Always check the store's own page for your city before you order.</div>
    </div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
